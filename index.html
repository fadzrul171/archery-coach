<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Archery Coaching Portal</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f6f7fb;
      color: #171717;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    /* ===============================
       BUTTON
    =============================== */

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .2s, transform .1s;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .btn-primary {
      background: #6339c7;
      color: white;
    }

    .btn-success {
      background: #18a957;
      color: white;
    }

    .btn-danger {
      background: #e34c4c;
      color: white;
    }

    .btn-light {
      background: #eeeaf9;
      color: #532ab5;
    }

    .btn-secondary {
      background: #ececec;
      color: #333;
    }

    .btn-full {
      width: 100%;
    }

    /* ===============================
       FORM
    =============================== */

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 14px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6339c7;
      box-shadow: 0 0 0 3px rgba(99, 57, 199, .08);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    /* ===============================
       AUTH
    =============================== */

    .auth {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 25px 0;
      background: #f2f2f4;
      padding: 5px;
      border-radius: 11px;
    }

    .tab {
      flex: 1;
      background: transparent;
      color: #666;
    }

    .tab.active {
      background: #6339c7;
      color: white;
    }

    /* ===============================
       APP LAYOUT
    =============================== */

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 235px;
      min-width: 235px;
      background: #111a27;
      color: white;
      padding: 24px 16px;
    }

    .sidebar h2 {
      font-size: 16px;
      margin: 0 0 30px;
    }

    .nav-item {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .nav-item:hover {
      background: #6339c7;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 30px;
      overflow: auto;
    }

    .topbar {
      display: flex;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .topbar h1 {
      margin: 0 0 5px;
    }

    /* ===============================
       CARDS
    =============================== */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      min-width: 0;
      background: white;
      padding: 20px;
      border-radius: 13px;
      border: 1px solid #eee;
    }

    .card h3 {
      margin: 7px 0 0;
      font-size: 25px;
      word-break: break-word;
    }

    .card small {
      color: #777;
    }

    /* ===============================
       PANELS / TABLES
    =============================== */

    .panel {
      background: white;
      border-radius: 13px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #eee;
      overflow: auto;
    }

    .panel-header {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .panel-header h3 {
      margin: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid #eee;
      padding: 12px 10px;
      font-size: 13px;
      vertical-align: middle;
    }

    th {
      color: #666;
      font-size: 12px;
      background: #fafafa;
    }

    /* ===============================
       BADGES
    =============================== */

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .paid {
      background: #dff8e9;
      color: #16763c;
    }

    .pending {
      background: #fff1ce;
      color: #a66b00;
    }

    .unpaid,
    .rejected {
      background: #ffe1e1;
      color: #ad3333;
    }

    /* ===============================
       MODAL
    =============================== */

    .modal {
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 15px;
      padding: 25px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    /* ===============================
       PAYMENT
    =============================== */

    .bank-box {
      background: #faf7ff;
      border: 1px solid #e1d6f9;
      padding: 16px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .bank-payment-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 18px;
      align-items: center;
    }

    .bank-details {
      min-width: 0;
    }

    .bank-box h3,
    .bank-box p {
      margin: 7px 0;
    }

    .qr-wrap {
      text-align: center;
    }

    .qr {
      max-width: 180px;
      width: 100%;
      display: block;
      margin: 0 auto;
      border-radius: 10px;
      background: #fff;
    }

    .qr-label {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      opacity: .8;
    }

    @media (max-width: 600px) {
      .bank-payment-layout {
        grid-template-columns: 1fr;
      }

      .qr-wrap {
        margin-top: 10px;
      }

      .qr {
        max-width: 180px;
      }
    }

    .amount {
      font-size: 26px;
      font-weight: 800;
      color: #6339c7;
      margin: 10px 0;
    }

    /* ===============================
       LOADING
    =============================== */

    .loading-overlay {
      position: fixed;
      z-index: 20000;
      inset: 0;
      background: rgba(255, 255, 255, .75);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-box {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
      padding: 20px 28px;
      font-weight: 700;
    }

    /* ===============================
       MOBILE MENU
    =============================== */

    .mobile-menu-btn {
      display: none;
    }

    .mobile-menu-backdrop {
      display: none;
    }

    @media(max-width: 800px) {
      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
      }

      .mobile-menu-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .35);
        z-index: 998;
      }

      .mobile-menu-backdrop.show {
        display: block;
      }

      .sidebar {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 999;
        transform: translateX(-110%);
        transition: transform .2s ease;
        box-shadow: 8px 0 25px rgba(0, 0, 0, .15);
        overflow-y: auto;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .content {
        width: 100%;
      }
    }

    /* ===============================
       RESPONSIVE
    =============================== */

    @media(max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width: 800px) {
      .content {
        padding: 15px;
      }

      .topbar h1 {
        font-size: 21px;
      }
    }

    @media(max-width: 520px) {
      .auth {
        padding: 12px;
        align-items: flex-start;
      }

      .auth-card {
        margin-top: 30px;
        padding: 22px;
      }

      .brand {
        font-size: 20px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .card {
        padding: 15px;
      }

      .card h3 {
        font-size: 19px;
      }

      .panel {
        padding: 14px;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-header .btn {
        width: 100%;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar > button {
        padding: 9px 11px;
      }
    }
  </style>
</head>


<body>

<!-- ==========================================
     LOGIN / REGISTER
=========================================== -->

<div id="authView" class="auth">

  <div class="auth-card">

    <div class="brand">
      🏹 Archery Coaching Portal
    </div>

    <div class="muted">
      Parent & Student Payment Management
    </div>


    <div class="tabs">

      <button
        id="loginTab"
        type="button"
        class="btn tab active"
        onclick="showLogin()"
      >
        Log Masuk
      </button>

      <button
        id="registerTab"
        type="button"
        class="btn tab"
        onclick="showRegister()"
      >
        Daftar Parent
      </button>

    </div>


    <!-- LOGIN -->

    <div id="loginBox">

      <label>
        No. Telefon / Email
      </label>

      <input
        id="loginInput"
        type="text"
        autocomplete="username"
        placeholder="Contoh: 0123456789"
      >


      <label>
        Password
      </label>

      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="Masukkan password"
      >


      <button
        type="button"
        class="btn btn-primary btn-full"
        onclick="login()"
      >
        Log Masuk
      </button>


      <p

      >
        Lupa password? Hubungi operator untuk reset password.
      </p>

    </div>


    <!-- REGISTER -->

    <div
      id="registerBox"
      class="hidden"
    >

      <label>
        Nama Parent / Penjaga
      </label>

      <input
        id="regName"
        type="text"
        autocomplete="name"
        placeholder="Nama penuh"
      >


      <label>
        No. Telefon
      </label>

      <input
        id="regPhone"
        type="tel"
        autocomplete="tel"
        placeholder="Contoh: 0123456789"
      >


      <label>
        Email
      </label>

      <input
        id="regEmail"
        type="email"
        autocomplete="email"
        placeholder="nama@email.com"
      >


      <label>
        Password
      </label>

      <input
        id="regPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Minimum 6 aksara"
      >


      <label>
        Confirm Password
      </label>

      <input
        id="regPasswordConfirm"
        type="password"
        autocomplete="new-password"
        placeholder="Masukkan semula password"
      >


      <button
        type="button"
        class="btn btn-primary btn-full"
        onclick="registerParent()"
      >
        Daftar Akaun
      </button>

    </div>

  </div>

</div>


<!-- ==========================================
     MAIN APP
=========================================== -->

<div
  id="mobileMenuBackdrop"
  class="mobile-menu-backdrop"
  onclick="closeMobileMenu()"
></div>


<div
  id="appView"
  class="hidden"
>

  <div class="layout">

    <aside class="sidebar">

      <h2>
        🏹 ARCHERY COACHING
      </h2>

      <div
        class="nav-item"
        onclick="closeMobileMenu(); loadDashboard()"
      >
        Dashboard
      </div>

      <div
        class="nav-item"
        onclick="closeMobileMenu(); editProfileModal()"
      >
        Edit Profile
      </div>

      <div
        class="nav-item"
        onclick="closeMobileMenu(); changePasswordModal()"
      >
        Tukar Password
      </div>

      <div
        class="nav-item"
        onclick="closeMobileMenu(); logout()"
      >
        Log Keluar
      </div>

    </aside>


    <main class="content">

      <div class="topbar">

        <div>

          <h1 id="pageTitle">
            Dashboard
          </h1>

          <div
            class="muted"
            id="welcomeText"
          ></div>

        </div>


        <div style="display:flex; gap:8px; align-items:center;">

          <button
            type="button"
            class="btn btn-light mobile-menu-btn"
            onclick="toggleMobileMenu()"
          >
            ☰ Menu
          </button>

          <button
            type="button"
            class="btn btn-light"
            onclick="logout()"
          >
            Log Keluar
          </button>

        </div>

      </div>


      <div id="dashboardContent">
      </div>

    </main>

  </div>

</div>


<!-- ==========================================
     MODAL
=========================================== -->

<div
  id="modal"
  class="modal hidden"
  onclick="modalBackgroundClick(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >
    <div id="modalContent"></div>
  </div>

</div>


<!-- ==========================================
     LOADING
=========================================== -->

<div
  id="loadingOverlay"
  class="loading-overlay hidden"
>

  <div class="loading-box">
    Memproses...
  </div>

</div>


<script>

/* ==========================================
   MOBILE MENU
========================================== */

function toggleMobileMenu() {

  var sidebar = document.querySelector('.sidebar');
  var backdrop = document.getElementById('mobileMenuBackdrop');

  if (!sidebar || !backdrop) {
    return;
  }

  var isOpen = sidebar.classList.toggle('mobile-open');
  backdrop.classList.toggle('show', isOpen);

}


function closeMobileMenu() {

  var sidebar = document.querySelector('.sidebar');
  var backdrop = document.getElementById('mobileMenuBackdrop');

  if (sidebar) {
    sidebar.classList.remove('mobile-open');
  }

  if (backdrop) {
    backdrop.classList.remove('show');
  }

}


/* ==========================================
   GLOBAL
========================================== */

var token = '';
var currentUser = null;
var parentData = null;


/* Malaysia local month */
function getLocalMonthKey() {

  var now = new Date();

  var year = now.getFullYear();

  var month =
    String(now.getMonth() + 1)
      .padStart(2, '0');

  return year + '-' + month;
}


function getTodayString() {

  var now = new Date();

  var year = now.getFullYear();

  var month =
    String(now.getMonth() + 1)
      .padStart(2, '0');

  var day =
    String(now.getDate())
      .padStart(2, '0');

  return (
    year +
    '-' +
    month +
    '-' +
    day
  );
}


var adminMonth = getLocalMonthKey();


/* ==========================================
   SAFE LOCAL STORAGE
========================================== */

function getStoredToken() {

  try {

    if (window.localStorage) {

      return (
        window.localStorage
          .getItem('archeryToken') || ''
      );

    }

  } catch (e) {

    console.log(
      'LocalStorage unavailable:',
      e
    );

  }

  return '';
}


function saveToken(value) {

  try {

    if (window.localStorage) {

      window.localStorage.setItem(
        'archeryToken',
        value
      );

    }

  } catch (e) {

    console.log(
      'Cannot save token:',
      e
    );

  }
}


function removeToken() {

  try {

    if (window.localStorage) {

      window.localStorage.removeItem(
        'archeryToken'
      );

    }

  } catch (e) {

    console.log(
      'Cannot remove token:',
      e
    );

  }
}


token = getStoredToken();


/* ==========================================
   LOADING
========================================== */

function showLoading(message) {

  var overlay =
    document.getElementById(
      'loadingOverlay'
    );

  if (!overlay) {
    return;
  }

  var box =
    overlay.querySelector(
      '.loading-box'
    );

  if (box) {
    box.textContent =
      message || 'Memproses...';
  }

  overlay.classList.remove('hidden');
}


function hideLoading() {

  var overlay =
    document.getElementById(
      'loadingOverlay'
    );

  if (overlay) {
    overlay.classList.add('hidden');
  }
}


/* ==========================================
   CLOUD API
========================================== */

var API_URL =
  'https://script.google.com/macros/s/AKfycbyVHD9_4QvT-7Ls5Z-fr-wvxEwx5ooGzlKDgjkO5SWMcMRNRJnWMChwoD1bgI7yldfqVg/exec';

function callApi(action, payload) {
  payload = payload || {};
  return new Promise(function(resolve, reject) {
    try {
      console.log('API REQUEST:', action, payload);
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload, token: token || '' })
      })
      .then(function(response) { return response.text(); })
      .then(function(text) {
        var res;
        try { res = JSON.parse(text); }
        catch (parseError) {
          console.error('API JSON PARSE ERROR:', text);
          throw new Error('Server tidak memulangkan response JSON yang sah.');
        }
        console.log('API RESPONSE:', action, res);
        if (!res || res.ok !== true) {
          throw new Error(res && res.message ? res.message : 'Server error.');
        }
        resolve(res.data);
      })
      .catch(function(error) {
        console.error('API FETCH ERROR:', action, error);
        reject(error);
      });
    } catch (e) {
      console.error('CALL API EXCEPTION:', e);
      reject(e);
    }
  });
}


/* ==========================================
   HELPERS
========================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    value = '';
  }

  return String(value)

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');
}


function money(value) {

  return (
    'RM' +
    Number(value || 0)
      .toFixed(2)
  );
}


function statusBadge(status) {

  status =
    String(
      status || 'UNPAID'
    ).toUpperCase();


  var labels = {
    PAID: 'Sudah Bayar',
    PENDING: 'Menunggu Semakan',
    UNPAID: 'Belum Bayar',
    REJECTED: 'Ditolak'
  };


  var label =
    labels[status] || status;


  return (
    '<span class="badge ' +
    status.toLowerCase() +
    '">' +
    escapeHtml(label) +
    '</span>'
  );
}


/* ==========================================
   LOGIN / REGISTER TAB
========================================== */

function showLogin() {

  var loginBox =
    document.getElementById(
      'loginBox'
    );

  var registerBox =
    document.getElementById(
      'registerBox'
    );

  var loginTab =
    document.getElementById(
      'loginTab'
    );

  var registerTab =
    document.getElementById(
      'registerTab'
    );


  loginBox.classList.remove(
    'hidden'
  );

  registerBox.classList.add(
    'hidden'
  );


  loginTab.classList.add(
    'active'
  );

  registerTab.classList.remove(
    'active'
  );
}


function showRegister() {

  var loginBox =
    document.getElementById(
      'loginBox'
    );

  var registerBox =
    document.getElementById(
      'registerBox'
    );

  var loginTab =
    document.getElementById(
      'loginTab'
    );

  var registerTab =
    document.getElementById(
      'registerTab'
    );


  registerBox.classList.remove(
    'hidden'
  );

  loginBox.classList.add(
    'hidden'
  );


  registerTab.classList.add(
    'active'
  );

  loginTab.classList.remove(
    'active'
  );
}


/* ==========================================
   REGISTER PARENT
========================================== */

async function registerParent() {

  var fullName =
    document.getElementById(
      'regName'
    ).value.trim();

  var phone =
    document.getElementById(
      'regPhone'
    ).value.trim();

  var email =
    document.getElementById(
      'regEmail'
    ).value.trim();

  var password =
    document.getElementById(
      'regPassword'
    ).value;

  var confirmPassword =
    document.getElementById(
      'regPasswordConfirm'
    ).value;


  if (!fullName) {

    alert(
      'Sila masukkan nama parent / penjaga.'
    );

    return;
  }


  if (!phone) {

    alert(
      'Sila masukkan no. telefon.'
    );

    return;
  }


  if (!email) {

    alert(
      'Sila masukkan email.'
    );

    return;
  }


  if (password.length < 6) {

    alert(
      'Password minimum 6 aksara.'
    );

    return;
  }


  if (
    password !==
    confirmPassword
  ) {

    alert(
      'Confirm password tidak sama.'
    );

    return;
  }


  try {

    showLoading(
      'Mendaftarkan akaun...'
    );


    await callApi(
      'registerParent',
      {

        fullName: fullName,

        phone: phone,

        email: email,

        password: password

      }
    );


    hideLoading();


    alert(
      'Pendaftaran berjaya. Sila log masuk.'
    );


    document.getElementById(
      'loginInput'
    ).value = email;


    document.getElementById(
      'regName'
    ).value = '';

    document.getElementById(
      'regPhone'

/* ==========================================
   LOGIN
========================================== */

async function login() {

  var loginValue =
    document.getElementById(
      'loginInput'
    ).value.trim();

  var passwordValue =
    document.getElementById(
      'passwordInput'
    ).value;


  if (
    !loginValue ||
    !passwordValue
  ) {

    alert(
      'Sila masukkan no. telefon/email dan password.'
    );

    return;
  }


  try {

    showLoading(
      'Log masuk...'
    );


    var data =
      await callApi(
        'login',
        {

          login: loginValue,

          password: passwordValue

        }
      );


    token = data.token;

    currentUser = data.user;


    saveToken(token);


    hideLoading();


    openApp();

    if (
      currentUser &&
      (
        currentUser.mustChangePassword === true ||
        String(currentUser.mustChangePassword) === 'true'
      )
    ) {
      setTimeout(
        function() {
          alert(
            'Password sementara. Sila tukar password anda.'
          );
          changePasswordModal();
        },
        250
      );
    }

  } catch (e) {

    hideLoading();


    console.error(
      'Login error:',
      e
    );


    alert(
      e && e.message
        ? e.message
        : 'Log masuk gagal.'
    );

  }
}


/* ==========================================
   LOGOUT
========================================== */

async function logout() {

  showLoading(
    'Log keluar...'
  );


  try {

    if (token) {

      await callApi(
        'logout',
        {}
      );

    }

  } catch (e) {

    console.log(
      'Logout server error:',
      e
    );

  }


  token = '';

  currentUser = null;

  parentData = null;


  removeToken();


  document
    .getElementById(
      'appView'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'authView'
    )
    .classList.remove(
      'hidden'
    );


  document.getElementById(
    'passwordInput'
  ).value = '';


  hideLoading();

  showLogin();
}


/* ==========================================
   RESTORE SESSION
========================================== */

async function restoreSession() {

  if (!token) {

    return;

  }


  try {

    showLoading(
      'Memuatkan akaun...'
    );


    var data =
      await callApi(
        'whoami',
        {}
      );


    currentUser =
      data.user;


    hideLoading();


    openApp();

    if (
      currentUser &&
      (
        currentUser.mustChangePassword === true ||
        String(currentUser.mustChangePassword) === 'true'
      )
    ) {
      setTimeout(
        function() {
          alert(
            'Password sementara. Sila tukar password anda.'
          );
          changePasswordModal();
        },
        250
      );
    }

  } catch (e) {

    console.log(
      'Session restore failed:',
      e
    );


    token = '';

    currentUser = null;


    removeToken();


    hideLoading();
  }
}

function openApp() {

  document
    .getElementById(
      'authView'

    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'appView'
    )

    );

function editStudentModal(studentId) {

  if (!parentData || !parentData.students) return;

  var student = parentData.students.find(function(item) {

  });

  if (!student) {

  }

  openModal(

    '<label>Nama Penuh Pelajar</label>' +
    '<input id="editStudentName" type="text" value="' +
    escapeHtmlAttr_(student.fullName || '') +
    '">' +

    '<label>Tarikh Lahir</label>' +
    '<input id="editStudentDob" type="date" value="' +
    escapeHtmlAttr_(formatDateInput_(student.dob)) +
    '">' +

    '<label>Jantina</label>' +
    '<select id="editStudentGender">' +
    '<option value="">Pilih</option>' +
    '<option value="Lelaki" ' + (student.gender === 'Lelaki' ? 'selected' : '') + '>Lelaki</option>' +
    '<option value="Perempuan" ' + (student.gender === 'Perempuan' ? 'selected' : '') + '>Perempuan</option>' +
    '</select>' +

    '<label>No. MyKid / IC</label>' +
    '<input id="editStudentMykid" type="text" value="' +
    escapeHtmlAttr_(student.mykid || '') +
    '">' +

    '<label>Sekolah</label>' +
    '<input id="editStudentSchool" type="text" value="' +
    escapeHtmlAttr_(student.school || '') +
    '">' +

    '<label>Tarikh Mula Coaching</label>' +
    '<input type="date" value="' +
    escapeHtmlAttr_(formatDateInput_(student.startDate)) +
    '" disabled>' +
    '<p class="muted">Tarikh mula coaching ditetapkan oleh admin dan tidak boleh diubah oleh parent.</p>' +

    '<div class="modal-actions">' +
    '<button type="button" class="btn btn-primary" onclick="saveStudentProfile(\'' +
    escapeHtml(student.id) +
    '\')">Simpan Perubahan</button>' +
    '<button type="button" class="btn btn-light" onclick="closeModal()">Batal</button>' +
    '</div>'
  );
}

function formatDateInput_(value) {
  if (!value) return '';
  var s = String(value);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
  var d = new Date(s);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

async function saveStudentProfile(studentId) {

  var fullName = document.getElementById('editStudentName').value.trim();
  var dob = document.getElementById('editStudentDob').value;
  var gender = document.getElementById('editStudentGender').value;
  var mykid = document.getElementById('editStudentMykid').value.trim();
  var school = document.getElementById('editStudentSchool').value.trim();

  if (!fullName) return alert('Sila masukkan nama pelajar.');
  if (!dob) return alert('Sila pilih tarikh lahir pelajar.');
  if (!gender) return alert('Sila pilih jantina pelajar.');
  if (!mykid) return alert('Sila masukkan No. MyKid / IC pelajar.');

  try {
    showLoading('Menyimpan profile pelajar...');

    await callApi('updateStudent', {
      studentId: studentId,
      fullName: fullName,
      dob: dob,
      gender: gender,
      mykid: mykid,
      school: school
    });

    closeModal();
    await loadParentDashboard();
    alert('Profile pelajar berjaya dikemaskini.');
  } catch (e) {
    hideLoading();
    alert(e && e.message ? e.message : 'Profile pelajar tidak dapat dikemaskini.');
  }
}

async function saveStudent() {

  var name =
    document.getElementById(
      'studentName'
    ).value.trim();

  var dob =
    document.getElementById(
      'studentDob'
    ).value;

  var gender =
    document.getElementById(
      'studentGender'
    ).value;

  var mykid =
    document.getElementById(
      'studentMykid'
    ).value.trim();


  if (!name) {

    alert(

    );

  }


  if (!dob) {

    alert(

    return;
  }


  if (!gender) {

  if (!mykid) {

  }


  try {

      'addStudent',

        dob: dob,

            'studentSchool'

    hideLoading();

      e && e.message
        ? e.message
        : 'Pelajar tidak dapat disimpan.'
    );

  }
}


/* ==========================================
   PAYMENT MODAL
========================================== */

function paymentModal(studentId, invoiceId) {

  if (!parentData) {
    return;
  }


  var student = null;


  parentData.students.forEach(
    function(item) {

      if (
        item.id === studentId
      ) {

        student = item;

      }

    }
  );


  if (!student) {

    alert(
      'Pelajar tidak dijumpai.'
    );

    return;
  }


  var invoice = null;
  if (invoiceId) {
    (parentData.invoices || []).forEach(function(item) {
      if (item.id === invoiceId) invoice = item;
    });
    if (!invoice) { alert('Invoice tidak dijumpai.'); return; }
  }

/* ==========================================
   SUBMIT PAYMENT
========================================== */

async function submitPayment() {

  var bankInput = document.getElementById('payBank');
  var bank = bankInput ? bankInput.value.trim() : '';

  if (!bank) {
    alert('Sila masukkan Bank / Kaedah Bayaran.');
    if (bankInput) bankInput.focus();
    return;
  }

  var fileInput =
    document.getElementById(
      'payProof'
    );


  var file =
    fileInput &&
    fileInput.files
      ? fileInput.files[0]
      : null;


  if (!file) {

    alert(
      'Sila pilih bukti pembayaran.'
    );

    return;
  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    alert(
      'Saiz fail maksimum 5MB.'
    );

    return;
  }


  var reference =
    document.getElementById(
      'payReference'
    ).value.trim();


  if (!reference) {

    alert(
      'Sila masukkan no. rujukan transaksi.'
    );

    return;
  }


  try {

    showLoading(
      'Menghantar bukti pembayaran...'
    );


    var dataUrl =
      await readFile(file);


    await callApi(
      'submitPayment',
      {

        studentId:
          document.getElementById(
            'payStudent'
          ).value,

        invoiceId:
          (document.getElementById('payInvoice') || {}).value || '',

        monthKey:
          document.getElementById(
            'payMonth'
          ).value,

        paidDate:
          document.getElementById(
            'payDate'
          ).value,

        bank: bank,

        referenceNo:
          reference,

        proof: {

          name:
            file.name,

          mimeType:
            file.type,

          data:
            dataUrl

        }

      }
    );


    alert(
      'Bukti bayaran telah dihantar untuk semakan.'
    );


    closeModal();


    await loadParentDashboard();

  } catch (e) {

    hideLoading();


    console.error(
      'Payment error:',
      e
    );


    alert(
      e && e.message
        ? e.message
        : 'Bukti bayaran gagal dihantar.'
    );

  }
}

async function submitEditManualInvoice(invoiceId) {
  var title = document.getElementById('editInvoiceTitle').value.trim();
  var description = document.getElementById('editInvoiceDescription').value.trim();
  var amount = document.getElementById('editInvoiceAmount').value;
  var invoiceDate = document.getElementById('editInvoiceDate').value;
  var dueDate = document.getElementById('editInvoiceDueDate').value;

  if (!title) { alert('Sila masukkan tajuk invoice.'); return; }
  if (!amount || Number(amount) <= 0) { alert('Sila masukkan amaun yang sah.'); return; }
  if (!invoiceDate || !dueDate) { alert('Sila lengkapkan tarikh invoice dan tarikh akhir bayaran.'); return; }
  if (dueDate < invoiceDate) { alert('Tarikh akhir bayaran tidak boleh lebih awal daripada tarikh invoice.'); return; }

  try {
    showLoading('Mengemaskini invoice...');
    var result = await callApi('updateManualInvoice', {
      invoiceId: invoiceId,
      title: title,
      description: description,
      amount: Number(amount),
      invoiceDate: invoiceDate,
      dueDate: dueDate
    });
    hideLoading();
    closeModal();
    alert(result.message || 'Invoice berjaya dikemaskini.');
    await loadAdminDashboard();
  } catch (e) {
    hideLoading();
    alert(e && e.message ? e.message : 'Invoice gagal dikemaskini.');
  }
}

async function deleteManualInvoice(invoiceId) {
  var invoice = null;
  var invoices = (window.adminData && adminData.invoices) || [];
  invoices.forEach(function(item) {
    if (item.id === invoiceId) invoice = item;

/* ==========================================
   FILE HELPERS
========================================== */

function downloadBase64(file) {

  var blob =
    base64ToBlob(
      file.base64,
      file.mimeType
    );


  var url =
    URL.createObjectURL(
      blob
    );


  var anchor =
    document.createElement(
      'a'
    );


  anchor.href = url;

  anchor.download =
    file.fileName ||
    'receipt.pdf';


  document.body.appendChild(
    anchor
  );


  anchor.click();


  document.body.removeChild(
    anchor
  );


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );
}


function base64ToBlob(
  base64,
  mime
) {

  var bytes =
    atob(base64);


  var array =
    new Uint8Array(
      bytes.length
    );


  for (
    var i = 0;
    i < bytes.length;
    i++
  ) {

    array[i] =
      bytes.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:
        mime ||
        'application/octet-stream'
    }
  );
}


function readFile(file) {

  return new Promise(
    function(resolve, reject) {

      var reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              'Fail tidak dapat dibaca.'
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );
}

    .replace(/</g, '&lt;')

}


async function saveProfile() {

  var fullName =
    document.getElementById('profileFullName').value.trim();

  var phone =
    document.getElementById('profilePhone').value.trim();

  var email =
    document.getElementById('profileEmail').value.trim();

  if (!fullName) {
    alert('Sila masukkan nama penuh.');

  if (!phone) {
    alert('Sila masukkan no. telefon.');
    return;
  }

  if (!email) {
    alert('Sila masukkan email.');
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert('Format email tidak sah.');
    return;
  }

  try {

    showLoading('Menyimpan profile...');

      'updateProfile',
      {
        fullName: fullName,
        phone: phone,
        email: email
      }

      currentUser.fullName = fullName;
      currentUser.phone = phone;

    var welcome = document.getElementById('welcomeText');

    hideLoading();

  }

    document.getElementById(

    document.getElementById(

    ).value;

  }


  if (
    newPassword.length < 6

    return;

  if (

    confirmPassword

  try {

    closeModal();

function formatDateDisplay_(value) {
  if (!value) return '-';
  var s = String(value);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    var p = s.substring(0, 10).split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return String(d.getDate()).padStart(2, '0') + '/' +
    String(d.getMonth() + 1).padStart(2, '0') + '/' +
    d.getFullYear();
}


function getAdminStudentById(studentId) {
  if (!window.adminData || !adminData.students) return null;
  return adminData.students.find(function(student) {
    return student.id === studentId;
  }) || null;
}

function toggleInvoiceRoyalty() {

  var checkbox =
    document.getElementById(
      'invoiceRoyaltyEnabled'
    );

  var wrap =
    document.getElementById(
      'invoiceRoyaltyWrap'
    );

  var amount =
    document.getElementById(
      'invoiceRoyaltyAmount'
    );


  if (!checkbox || !wrap) {
    return;
  }


  if (checkbox.checked) {

    wrap.style.display = '';

  } else {

    wrap.style.display = 'none';

    if (amount) {
      amount.value = '';
    }

  }

}


// =====================================================
// SUBMIT MANUAL INVOICE V30
// =====================================================

async function submitManualInvoice() {

  var recipientType =
    document.getElementById(
      'invoiceRecipientType'
    ).value;


  var parentId =
    document.getElementById(
      'invoiceParentId'
    ).value;


  var studentId =
    document.getElementById(
      'invoiceStudentId'
    )
      ? document.getElementById(
          'invoiceStudentId'
        ).value
      : '';


  var title =
    document.getElementById(
      'invoiceTitle'
    ).value.trim();


  var description =
    document.getElementById(
      'invoiceDescription'
    ).value.trim();


  var amount =
    document.getElementById(
      'invoiceAmount'
    ).value;


  var invoiceDate =
    document.getElementById(
      'invoiceDate'
    ).value;


  var dueDate =
    document.getElementById(
      'invoiceDueDate'
    ).value;


  // ================================================
  // ROYALTY
  // ================================================

  var royaltyEnabled =
    document.getElementById(
      'invoiceRoyaltyEnabled'
    )
      ? document.getElementById(
          'invoiceRoyaltyEnabled'
        ).checked
      : false;


  var royaltyAmount =
    document.getElementById(
      'invoiceRoyaltyAmount'
    )
      ? document.getElementById(
          'invoiceRoyaltyAmount'
        ).value
      : 0;


  // ================================================
  // VALIDATION
  // ================================================

  if (
    recipientType === 'SINGLE' &&
    !parentId
  ) {

    alert(
      'Sila pilih parent.'
    );

    return;

  }


  if (
    recipientType === 'SINGLE' &&
    !studentId
  ) {

    alert(
      'Sila pilih pelajar.'
    );

    return;

  }


  if (!title) {

    alert(
      'Sila masukkan tajuk invoice.'
    );

    return;

  }


  if (
    !amount ||
    Number(amount) <= 0
  ) {

    alert(
      'Sila masukkan amaun yang sah.'
    );

    return;

  }


  if (
    !invoiceDate ||
    !dueDate
  ) {

    alert(
      'Sila lengkapkan tarikh invoice dan tarikh akhir bayaran.'
    );

    return;

  }


  if (
    dueDate < invoiceDate
  ) {

    alert(
      'Tarikh akhir bayaran tidak boleh lebih awal daripada tarikh invoice.'
    );

    return;

  }


  if (
    royaltyEnabled &&
    (
      !royaltyAmount ||
      Number(royaltyAmount) < 0
    )
  ) {

    alert(
      'Sila masukkan amaun royalti yang sah.'
    );

    return;

  }


  try {

    showLoading(
      'Menjana invoice...'
    );


    var result =
      await callApi(
        'generateManualInvoice',
        {

          recipientType:
            recipientType,

          parentId:
            parentId,

          studentId:
            studentId,

          title:
            title,

          description:
            description,

          amount:
            Number(amount),

          invoiceDate:
            invoiceDate,

          dueDate:
            dueDate,

          // V30
          royaltyEnabled:
            royaltyEnabled,

          royaltyAmount:
            royaltyEnabled
              ? Number(
                  royaltyAmount
                )
              : 0

        }
      );


    hideLoading();

    closeModal();


    alert(
      result.message ||
      'Invoice berjaya dijana.'
    );


    await loadAdminDashboard();


  } catch (e) {

    hideLoading();


    alert(
      e && e.message
        ? e.message
        : 'Invoice gagal dijana.'
    );

  }

}
